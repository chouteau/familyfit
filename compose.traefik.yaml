name: familyfit

services:
  web:
    image: ghcr.io/chouteau/familyfit:${FAMILYFIT_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      FamilyFit__PublicUrl: "https://${FAMILYFIT_DOMAIN:-fit.chouteau.info}"
      FamilyFit__Demo: "false"
      FamilyFit__DataDirectory: /data
      # Exact IP of Traefik on the shared Docker network.
      ReverseProxy__KnownProxies__0: ${TRAEFIK_PROXY_IP:?Set the Traefik IP on the shared network}
      FAMILYFIT_BOOTSTRAP_CODE: ${FAMILYFIT_BOOTSTRAP_CODE:-}
      MCP_API_KEY: ${MCP_API_KEY:-}
      MCP_READ_ONLY: ${MCP_READ_ONLY:-false}
    volumes:
      - familyfit-data:/data
    expose:
      - "8080"
    networks:
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:?Set the existing Traefik Docker network name}
      traefik.http.routers.familyfit.rule: "Host(`${FAMILYFIT_DOMAIN:-fit.chouteau.info}`)"
      traefik.http.routers.familyfit.entrypoints: ${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}
      traefik.http.routers.familyfit.tls: "true"
      traefik.http.routers.familyfit.tls.certresolver: ${TRAEFIK_CERTRESOLVER:?Set the existing Traefik TLS resolver name}
      traefik.http.routers.familyfit.service: familyfit
      traefik.http.services.familyfit.loadbalancer.server.port: "8080"
      traefik.http.services.familyfit.loadbalancer.server.scheme: http
      traefik.http.services.familyfit.loadbalancer.passhostheader: "true"
      traefik.http.routers.familyfit-http.rule: "Host(`${FAMILYFIT_DOMAIN:-fit.chouteau.info}`)"
      traefik.http.routers.familyfit-http.entrypoints: ${TRAEFIK_HTTP_ENTRYPOINT:-web}
      traefik.http.routers.familyfit-http.service: familyfit
      traefik.http.routers.familyfit-http.middlewares: familyfit-https
      traefik.http.middlewares.familyfit-https.redirectscheme.scheme: https
      traefik.http.middlewares.familyfit-https.redirectscheme.permanent: "true"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  familyfit-data:

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:?Set the existing Traefik Docker network name}
